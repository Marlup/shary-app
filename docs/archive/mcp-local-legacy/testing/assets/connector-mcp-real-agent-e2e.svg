<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">External tools connecting securely to Shary</title>
  <desc id="desc">A local AI tool reaches the Shary Android MCP server through Windows loopback and ADB forwarding. Shary authenticates the connector, enforces policy, accesses repositories, records an audit decision, and returns a structured result.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .background { fill: #f7f9fc; }
      .group { fill: #eef4ff; stroke: #7b9acc; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #334e68; stroke-width: 2; rx: 12; }
      .security { fill: #fff4db; stroke: #b7791f; }
      .data { fill: #e6fffa; stroke: #2c7a7b; }
      .audit { fill: #f3e8ff; stroke: #805ad5; }
      .title { font: 700 24px Arial, sans-serif; fill: #102a43; }
      .label { font: 600 16px Arial, sans-serif; fill: #102a43; text-anchor: middle; }
      .small { font: 14px Arial, sans-serif; fill: #334e68; text-anchor: middle; }
      .edge { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 13px Arial, sans-serif; fill: #334e68; text-anchor: middle; }
    </style>
  </defs>

  <rect class="background" width="1440" height="620"/>
  <text class="title" x="720" y="42" text-anchor="middle">How external tools connect to and operate on Shary</text>

  <rect class="group" x="35" y="75" width="500" height="455" rx="20"/>
  <text class="label" x="285" y="107">Windows host</text>

  <rect class="group" x="565" y="75" width="840" height="455" rx="20"/>
  <text class="label" x="985" y="107">Shary Android app</text>

  <rect class="node" x="65" y="155" width="180" height="78"/>
  <text class="label" x="155" y="185">User request</text>
  <text class="small" x="155" y="210">Natural language</text>

  <rect class="node" x="310" y="145" width="195" height="98"/>
  <text class="label" x="407" y="178">External MCP tool</text>
  <text class="small" x="407" y="203">Codex, Claude Code,</text>
  <text class="small" x="407" y="222">or another local client</text>

  <rect class="node" x="310" y="345" width="195" height="90"/>
  <text class="label" x="407" y="378">Windows loopback</text>
  <text class="small" x="407" y="403">127.0.0.1:8765/mcp</text>

  <rect class="node" x="600" y="345" width="190" height="90"/>
  <text class="label" x="695" y="378">MCP HTTP server</text>
  <text class="small" x="695" y="403">Inside Shary process</text>

  <rect class="node" x="840" y="345" width="190" height="90"/>
  <text class="label" x="935" y="378">JSON-RPC adapter</text>
  <text class="small" x="935" y="403">Maps MCP tools</text>

  <rect class="node security" x="1080" y="330" width="270" height="120"/>
  <text class="label" x="1215" y="365">Connector security boundary</text>
  <text class="small" x="1215" y="391">Bearer authentication</text>
  <text class="small" x="1215" y="412">Capabilities, confirmation,</text>
  <text class="small" x="1215" y="431">and idempotency enforcement</text>

  <rect class="node data" x="1090" y="155" width="250" height="90"/>
  <text class="label" x="1215" y="188">Shary repositories</text>
  <text class="small" x="1215" y="213">Fields and users</text>

  <rect class="node audit" x="840" y="155" width="190" height="90"/>
  <text class="label" x="935" y="188">Audit history</text>
  <text class="small" x="935" y="213">Allowed or denied</text>

  <path class="edge" d="M245 194 H300"/>
  <path class="edge" d="M407 243 V335"/>
  <text class="edge-label" x="466" y="293">MCP HTTP + bearer</text>
  <path class="edge" d="M505 390 H590"/>
  <text class="edge-label" x="548" y="375">ADB forward</text>
  <path class="edge" d="M790 390 H830"/>
  <path class="edge" d="M1030 390 H1070"/>
  <path class="edge" d="M1215 330 V255"/>
  <text class="edge-label" x="1295" y="292">Allowed operation</text>
  <path class="edge" d="M1080 362 C1030 305, 1000 265, 960 247"/>
  <text class="edge-label" x="1018" y="292">Audit decision</text>
  <path class="edge" d="M1090 188 C850 115, 545 110, 455 140"/>
  <text class="edge-label" x="760" y="115">Structured result returns to the external tool</text>
  <path class="edge" d="M310 172 H255"/>
  <text class="edge-label" x="280" y="157">Grounded response</text>

  <text class="small" x="720" y="575">Shary remains the authority for authentication, capability checks, mutation approval, data access, and audit recording.</text>
</svg>
